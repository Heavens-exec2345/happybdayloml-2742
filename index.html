<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoş Geldin 🐰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffc0cb; /* Tatlı pembe */
            color: #4a148c;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid #ff8da1;
        }

        .bunny-icon {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 2em;
            color: #c2185b;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #311b92;
        }

        .sub-text {
            font-size: 0.9em;
            color: #880e4f;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1em;
            border: 2px solid #c2185b;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #4a148c;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        input[type="password"]::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 1.05em;
            border: none;
            border-radius: 12px;
            background: #c2185b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ad1457;
        }

        .hint-btn {
            background: transparent;
            border: 1px dashed #c2185b;
            color: #c2185b;
            margin-bottom: 15px;
            font-size: 0.9em;
            padding: 8px;
        }

        .hint-btn:hover {
            background: rgba(194, 24, 91, 0.1);
        }

        .hint-box {
            background: #ffe4e8;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #880e4f;
            border-left: 4px solid #c2185b;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- 1. ADIM: Karşılama Ekranı -->
    <div class="card" id="welcome-screen" onclick="showPasswordScreen()">
        <span class="bunny-icon">🐰</span>
        <h1>Merhaba Prensesim</h1>
        <p class="sub-text">Hadi bakalım, içeri girmek için ekrana tıkla...</p>
    </div>

    <!-- 2. ADIM: Şifre Ekranı -->
    <div class="card hidden" id="password-screen">
        <span class="bunny-icon">🥕</span>
        <h1>Şifre nedir sence???</h1>
        
        <!-- İpucu Mesaj Alanı -->
        <div id="hint-text-box" class="hint-box hidden">
            <b>İpucu:</b> Kendi doğduğun yılı yaz! 🐾
        </div>

        <!-- İpucu Butonu -->
        <button id="hint-btn" class="hint-btn hidden" onclick="toggleHint()">Küçük bir ipucu ister misin?</button>

        <input type="password" id="pass-input" placeholder="Şifreyi giriniz...">
        <button onclick="checkPassword()">Aç bakalım kapıyı!</button>
    </div>

    <script>
        let wrongCount = 0;

        function showPasswordScreen() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('password-screen').classList.remove('hidden');
        }

        function toggleHint() {
            document.getElementById('hint-text-box').classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');
        }

        function checkPassword() {
            const input = document.getElementById('pass-input').value.trim();
            
            if (input === "2012") {
                window.location.href = "anasayfa.html";
            } else {
                wrongCount++;
                alert("Üzgünüm, bu pek doğru değildi. Tekrar dene!");
                
                if (wrongCount >= 1) {
                    document.getElementById('hint-btn').classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
