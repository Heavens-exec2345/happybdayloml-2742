<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minik Prensesin Oyun Paneli 🌸</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffe6f2;
            color: #d63384;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Sahte Yükleme Ekranı */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe6f2; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #ffb3d9;
            border-top: 5px solid #ff1493; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Başlık & Menü Grid Düzeni */
        h1 { margin: 20px 10px 15px 10px; font-size: 1.6rem; text-align: center; text-shadow: 1px 1px 2px #ffb3d9; }
        
        #panel-menu {
            width: 95%; max-width: 500px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 10px;
        }
        .game-card {
            background: white; border: 2px solid #ffb3d9; border-radius: 15px;
            padding: 12px 5px; text-align: center; font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2); cursor: pointer;
            transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card:last-child { grid-column: span 3; max-width: 60%; justify-self: center; }

        /* Oyun Konteyneri ve Canvas */
        #game-container {
            display: none; width: 100%; max-width: 420px;
            flex-direction: column; align-items: center; position: relative;
        }
        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(255, 255, 255, 0.8); border-radius: 15px; margin-bottom: 8px;
        }
        .hearts-box img { width: 22px; height: 22px; margin-right: 2px; }
        .score-box { font-weight: bold; font-size: 0.9rem; }
        
        #canvas-wrapper {
            position: relative; width: 360px; height: 500px;
            border: 3px solid #ffb3d9; border-radius: 20px; overflow: hidden; background: #fff0f6;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* Game Over Ekranı */
        #game-over-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; color: white; text-align: center;
        }
        #game-over-overlay img { width: 100px; margin-bottom: 15px; }
        #game-over-overlay h2 { font-size: 2rem; color: #ff66b2; margin-bottom: 15px; }
        
        .btn {
            background-color: #ff66b2; color: white; border: none; padding: 10px 20px;
            font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
            margin: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Sahte Yükleme Ekranı -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="color: #d63384; font-weight: bold;">Oyun Paneli Yükleniyor... 🌸</p>
    </div>

    <!-- Panel Başlığı -->
    <h1 id="panel-title">🌸 Minik Prensesin Oyun Paneli 🌸</h1>

    <!-- 3 Yan Yana + 1 Alt Menü -->
    <div id="panel-menu">
        <div class="game-card" onclick="startGame(1)">🌸 Bunny Flap</div>
        <div class="game-card" onclick="startGame(2)">🌸 Bunny Rush</div>
        <div class="game-card" onclick="startGame(3)">🌸 Precision Tap</div>
        <div class="game-card" onclick="startGame(4)">🌸 Bunny Attack</div>
        <div class="game-card" onclick="startGame(5)">🌸 Carrot Catch</div>
        <div class="game-card" onclick="startGame(6)">🌸 Perfect Timing</div>
        <div class="game-card" onclick="startGame(7)">🌸 Memory Tap</div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game-container">
        <div class="top-bar">
            <div class="hearts-box" id="hearts-display"></div>
            <div class="score-box">
                Skor: <span id="current-score">0</span> | En Yüksek: <span id="high-score">0</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="500"></canvas>

            <!-- Game Over Overlay -->
            <div id="game-over-overlay">
                <img src="BunnyDead.gif" alt="Oyun Bitti">
                <h2>OYUN BİTTİ</h2>
                <div>
                    <button class="btn" onclick="restartCurrentGame()">Yeniden Başlat 🔄</button>
                    <button class="btn" onclick="backToPanel()">Panele Dön 🏠</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Asset Yüklemeleri
        const assets = {};
        const assetList = [
            'heart.png', 'carrot.png', 'star.png', 'bomb.png', 'rock.png',
            'hole.png', 'littlewolf.png', 'longpipe.png', 'smallpipe.png',
            'giftblock.png', 'taretzone.png', 'ground.png', 'background.png',
            'BunnyJump.gif', 'BunnyLieDown.gif', 'BunnyRun.gif', 'BunnyIdle.gif', 'BunnyDead.gif'
        ];

        assetList.forEach(name => {
            const img = new Image();
            img.src = name;
            assets[name] = img;
        });

        // Sahte Yükleme Kapatma
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 600);
            }, 2000);
        });

        // Genel Oyun Değişkenleri
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentGame = 0;
        let gameLoopId = null;
        let score = 0;
        let highScore = 0;
        let lives = 3;
        let isGameOver = false;

        // Tıklama / Dokunma Dinleyicisi
        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            handleInput(clickX, clickY);
        });

        function updateUI() {
            document.getElementById('current-score').innerText = score;
            highScore = localStorage.getItem('hs_game_' + currentGame) || 0;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('hs_game_' + currentGame, highScore);
            }
            document.getElementById('high-score').innerText = highScore;

            // Canları Çizdirme
            const hDisplay = document.getElementById('hearts-display');
            hDisplay.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                hDisplay.innerHTML += '<img src="heart.png">';
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);
            document.getElementById('game-over-overlay').style.display = 'flex';
        }

        function backToPanel() {
            cancelAnimationFrame(gameLoopId);
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-over-overlay').style.display = 'none';
            document.getElementById('panel-menu').style.display = 'grid';
            document.getElementById('panel-title').style.display = 'block';
            currentGame = 0;
        }

        function restartCurrentGame() {
            document.getElementById('game-over-overlay').style.display = 'none';
            startGame(currentGame);
        }

        function startGame(gameId) {
            currentGame = gameId;
            score = 0;
            lives = 3;
            isGameOver = false;
            document.getElementById('panel-menu').style.display = 'none';
            document.getElementById('panel-title').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            updateUI();

            if (gameLoopId) cancelAnimationFrame(gameLoopId);

            // Oyun Başlatıcılar
            if (gameId === 1) initBunnyFlap();
            else if (gameId === 2) initBunnyRush();
            else if (gameId === 3) initPrecisionTap();
            else if (gameId === 4) initBunnyAttack();
            else if (gameId === 5) initCarrotCatch();
            else if (gameId === 6) initPerfectTiming();
            else if (gameId === 7) initMemoryTap();
        }

        let handleInput = (x, y) => {};

        /* ================= 1. BUNNY FLAP ================= */
        function initBunnyFlap() {
            let bY = 200, bV = 0, gravity = 0.35, jump = -6;
            let pipes = [], bombs = [], frame = 0;
            let isJumping = false;

            handleInput = () => {
                bV = jump;
                isJumping = true;
                setTimeout(() => isJumping = false, 300);
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                frame++;
                bV += gravity; bY += bV;

                if (frame % 110 === 0) {
                    let gap = 130;
                    let topH = Math.floor(Math.random() * (220 - 60)) + 60;
                    pipes.push({ x: 360, top: topH, bottom: 500 - topH - gap, passed: false });
                    if (score >= 20 && Math.random() > 0.4) {
                        bombs.push({ x: 360 + 20, y: topH + gap/2 - 15, active: true });
                    }
                }

                // Borular
                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i]; p.x -= 2;
                    ctx.drawImage(assets['longpipe.png'], p.x, 0, 45, p.top);
                    ctx.drawImage(assets['smallpipe.png'], p.x, 500 - p.bottom, 45, p.bottom);

                    if (!p.passed && p.x < 100) { p.passed = true; score += 5; updateUI(); }

                    // Çarpışma
                    if (100 + 30 > p.x && 100 < p.x + 45) {
                        if (bY < p.top || bY + 35 > 500 - p.bottom) {
                            lives--; updateUI();
                            if (lives <= 0) return triggerGameOver();
                            pipes.splice(i, 1); continue;
                        }
                    }
                    if (p.x < -50) pipes.splice(i, 1);
                }

                // Bombalar (20 Skor Sonrası)
                for (let i = bombs.length - 1; i >= 0; i--) {
                    let bm = bombs[i]; bm.x -= 2;
                    if (bm.active) {
                        ctx.drawImage(assets['bomb.png'], bm.x, bm.y, 30, 30);
                        if (Math.hypot(100 - bm.x, bY - bm.y) < 28) {
                            bm.active = false; lives--; updateUI();
                            if (lives <= 0) return triggerGameOver();
                        }
                    }
                    if (bm.x < -30) bombs.splice(i, 1);
                }

                // Tavşan Çizimi
                let img = isJumping ? assets['BunnyJump.gif'] : assets['BunnyLieDown.gif'];
                ctx.drawImage(img, 100, bY, 40, 40);

                if (bY > 470 || bY < -20) {
                    lives--; updateUI();
                    if (lives <= 0) return triggerGameOver();
                    bY = 200; bV = 0;
                }

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 2. BUNNY RUSH ================= */
        function initBunnyRush() {
            let bY = 380, bV = 0, gravity = 0.5, isGrounded = true;
            let obstacles = [], frame = 0, speed = 3;

            handleInput = () => {
                if (isGrounded) { bV = -11; isGrounded = false; score += 10; updateUI(); }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                frame++; speed += 0.001;
                ctx.drawImage(assets['ground.png'], 0, 420, 360, 80);

                bV += gravity; bY += bV;
                if (bY >= 380) { bY = 380; bV = 0; isGrounded = true; }

                if (frame % Math.floor(120 / (speed/3)) === 0) {
                    let type = Math.random() > 0.4 ? 'rock.png' : 'bomb.png';
                    obstacles.push({ x: 360, type: type });
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i]; obs.x -= speed;
                    ctx.drawImage(assets[obs.type], obs.x, 390, 35, 35);

                    if (obs.x < 85 && obs.x > 45 && bY > 350) {
                        lives--; updateUI();
                        obstacles.splice(i, 1);
                        if (lives <= 0) return triggerGameOver();
                        continue;
                    }
                    if (obs.x < -40) obstacles.splice(i, 1);
                }

                ctx.drawImage(assets['BunnyRun.gif'], 50, bY, 45, 45);
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 3. PRECISION TAP ================= */
        function initPrecisionTap() {
            let heartX = 0, heartY = 0, timer = 10, maxTime = 10, intervalId = null;

            function spawnHeart() {
                heartX = 80 + Math.random() * 180;
                heartY = 150 + Math.random() * 180;
            }

            handleInput = (x, y) => {
                if (Math.hypot(x - heartX, y - heartY) < 35) {
                    score += 15;
                    maxTime = Math.max(2, maxTime - 0.4);
                    timer = maxTime;
                    updateUI(); spawnHeart();
                }
            };

            spawnHeart();
            intervalId = setInterval(() => {
                timer -= 0.1;
                if (timer <= 0) {
                    lives--; updateUI(); timer = maxTime;
                    if (lives <= 0) { clearInterval(intervalId); triggerGameOver(); }
                }
            }, 100);

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['taretzone.png'], 30, 100, 300, 300);
                ctx.drawImage(assets['heart.png'], heartX - 20, heartY - 20, 40, 40);

                ctx.fillStyle = "#ff1493";
                ctx.fillRect(30, 30, (timer / maxTime) * 300, 15);
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
                else clearInterval(intervalId);
            }
            loop();
        }

        /* ================= 4. BUNNY ATTACK ================= */
        function initBunnyAttack() {
            let holes = [
                {x: 50, y: 120}, {x: 210, y: 120},
                {x: 50, y: 240}, {x: 210, y: 240},
                {x: 50, y: 360}, {x: 210, y: 360}
            ];
            let activeHole = -1, type = 'wolf', popTimer = 0;

            function spawn() {
                activeHole = Math.floor(Math.random() * 6);
                type = Math.random() > 0.3 ? 'wolf' : 'bunny';
                popTimer = Math.max(40, 120 - score * 2);
            }

            handleInput = (x, y) => {
                if (activeHole !== -1) {
                    let h = holes[activeHole];
                    if (x > h.x && x < h.x + 100 && y > h.y && y < h.y + 80) {
                        if (type === 'wolf') { score += 10; updateUI(); }
                        else { lives--; updateUI(); if (lives <= 0) triggerGameOver(); }
                        activeHole = -1;
                    }
                }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                holes.forEach((h, idx) => {
                    ctx.drawImage(assets['hole.png'], h.x, h.y, 100, 80);
                    if (idx === activeHole) {
                        let img = type === 'wolf' ? assets['littlewolf.png'] : assets['BunnyIdle.gif'];
                        ctx.drawImage(img, h.x + 20, h.y - 30, 60, 60);
                    }
                });

                if (activeHole !== -1) {
                    popTimer--;
                    if (popTimer <= 0) {
                        if (type === 'wolf') { lives--; updateUI(); if (lives <= 0) triggerGameOver(); }
                        activeHole = -1;
                    }
                } else if (Math.random() < 0.03) spawn();

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 5. CARROT CATCH ================= */
        function initCarrotCatch() {
            let bX = 160, items = [], frame = 0, speed = 2.5;

            handleInput = (x) => { bX = x - 25; };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['ground.png'], 0, 430, 360, 70);
                frame++; speed += 0.001;

                if (frame % 40 === 0) {
                    let r = Math.random();
                    let t = r < 0.6 ? 'carrot.png' : (r < 0.8 ? 'star.png' : 'bomb.png');
                    items.push({ x: 20 + Math.random() * 320, y: 0, type: t });
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i]; it.y += speed;
                    ctx.drawImage(assets[it.type], it.x, it.y, 30, 30);

                    if (it.y > 400 && it.x > bX - 20 && it.x < bX + 50) {
                        if (it.type === 'carrot.png') score += 10;
                        else if (it.type === 'star.png') score += 25;
                        else { lives--; if (lives <= 0) return triggerGameOver(); }
                        updateUI(); items.splice(i, 1); continue;
                    }
                    if (it.y > 480) items.splice(i, 1);
                }

                ctx.drawImage(assets['BunnyRun.gif'], bX, 390, 50, 50);
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 6. PERFECT TIMING ================= */
        function initPerfectTiming() {
            let blocks = [{ x: 130, y: 440, w: 100 }], current = { x: 0, y: 400, w: 100, dir: 1 };
            let speed = 3;

            handleInput = () => {
                let prev = blocks[blocks.length - 1];
                let diff = current.x - prev.x;
                if (Math.abs(diff) < current.w) {
                    score += 20; updateUI();
                    blocks.push({ x: current.x, y: current.y, w: current.w });
                    current.y -= 35; current.x = 0; speed += 0.3;
                    if (blocks.length > 8) blocks.forEach(b => b.y += 35);
                } else {
                    lives--; updateUI();
                    if (lives <= 0) triggerGameOver();
                }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                blocks.forEach(b => ctx.drawImage(assets['giftblock.png'], b.x, b.y, b.w, 30));

                current.x += speed * current.dir;
                if (current.x < 0 || current.x + current.w > 360) current.dir *= -1;
                ctx.drawImage(assets['giftblock.png'], current.x, current.y, current.w, 30);

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 7. MEMORY TAP ================= */
        function initMemoryTap() {
            let sequence = [], userSeq = [], showing = false, level = 1;
            const icons = ['star.png', 'bomb.png', 'rock.png', 'heart.png'];

            function nextRound() {
                showing = true; userSeq = [];
                sequence.push(icons[Math.floor(Math.random() * 4)]);
                let idx = 0;
                let int = setInterval(() => {
                    ctx.clearRect(0, 0, 360, 500);
                    ctx.drawImage(assets[sequence[idx]], 130, 120, 100, 100);
                    idx++;
                    if (idx >= sequence.length) {
                        clearInterval(int);
                        setTimeout(() => { showing = false; drawButtons(); }, 800);
                    }
                }, 700);
            }

            function drawButtons() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.fillStyle = "#ff66b2"; ctx.font = "16px Arial";
                ctx.fillText("Sırayı Hatırla ve Bas!", 110, 80);
                icons.forEach((ic, i) => {
                    let x = (i % 2) * 140 + 50, y = Math.floor(i / 2) * 140 + 150;
                    ctx.drawImage(assets[ic], x, y, 90, 90);
                });
            }

            handleInput = (x, y) => {
                if (showing) return;
                icons.forEach((ic, i) => {
                    let bx = (i % 2) * 140 + 50, by = Math.floor(i / 2) * 140 + 150;
                    if (x > bx && x < bx + 90 && y > by && y < by + 90) {
                        userSeq.push(ic);
                        let step = userSeq.length - 1;
                        if (userSeq[step] !== sequence[step]) {
                            lives--; updateUI();
                            if (lives <= 0) triggerGameOver();
                            else nextRound();
                        } else if (userSeq.length === sequence.length) {
                            score += 30; updateUI(); nextRound();
                        }
                    }
                });
            };

            nextRound();
            function loop() {
                if (!showing && !isGameOver) drawButtons();
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
