<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minik Prensesin Oyun Paneli 🌸</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d63384;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Videosu */
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
        }
        .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 230, 242, 0.45);
            z-index: -1;
        }

        /* Sahte Yükleme Ekranı */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe6f2; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #ffb3d9;
            border-top: 5px solid #ff1493; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Başlık & Menü Grid Düzeni */
        h1 { margin: 25px 10px 15px 10px; font-size: 1.6rem; text-align: center; text-shadow: 1px 1px 2px #fff; }
        
        #panel-menu {
            width: 95%; max-width: 500px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 10px;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #ffb3d9; border-radius: 15px;
            padding: 12px 5px; text-align: center; font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2); cursor: pointer;
            transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
            backdrop-filter: blur(3px);
        }
        .game-card:active { transform: scale(0.95); }
        .game-card:last-child { grid-column: span 3; max-width: 60%; justify-self: center; }

        /* Oyun Konteyneri ve Canvas */
        #game-container {
            display: none; width: 100%; max-width: 420px;
            flex-direction: column; align-items: center; position: relative; margin-top: 10px;
        }
        .top-bar {
            width: 360px; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(255, 255, 255, 0.9); border-radius: 15px; margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .hearts-box img { width: 22px; height: 22px; margin-right: 2px; }
        .score-box { font-weight: bold; font-size: 0.9rem; }
        
        #canvas-wrapper {
            position: relative; width: 360px; height: 500px;
            border: 3px solid #ffb3d9; border-radius: 20px; overflow: hidden; background: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* Game Over Ekranı */
        #game-over-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; color: white; text-align: center;
        }
        #game-over-overlay img { width: 90px; margin-bottom: 15px; }
        #game-over-overlay h2 { font-size: 2rem; color: #ff66b2; margin-bottom: 15px; }
        
        .btn {
            background-color: #ff66b2; color: white; border: none; padding: 10px 20px;
            font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
            margin: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Arka Plan Videomuz -->
    <video autoplay muted loop id="bg-video">
        <source src="bunnybackgorund.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Sahte Yükleme Ekranı -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="color: #d63384; font-weight: bold;">Oyun Paneli Yükleniyor... 🌸</p>
    </div>

    <!-- Panel Başlığı -->
    <h1 id="panel-title">🌸 Minik Prensesin Oyun Paneli 🌸</h1>

    <!-- Menü Butonları -->
    <div id="panel-menu">
        <div class="game-card" onclick="startGame(1)">🌸 Bunny Flap</div>
        <div class="game-card" onclick="startGame(2)">🌸 Bunny Rush</div>
        <div class="game-card" onclick="startGame(3)">🌸 Precision Tap</div>
        <div class="game-card" onclick="startGame(4)">🌸 Bunny Attack</div>
        <div class="game-card" onclick="startGame(5)">🌸 Carrot Catch</div>
        <div class="game-card" onclick="startGame(6)">🌸 Perfect Timing</div>
        <div class="game-card" onclick="startGame(7)">🌸 Memory Tap</div>
    </div>

    <!-- Oyun Alanı -->
    <div id="game-container">
        <div class="top-bar">
            <div class="hearts-box" id="hearts-display"></div>
            <div class="score-box">
                Skor: <span id="current-score">0</span> | En Yüksek: <span id="high-score">0</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="500"></canvas>

            <!-- Game Over Overlay -->
            <div id="game-over-overlay">
                <img id="dead-gif-img" src="BunnyDead.gif" alt="Oyun Bitti">
                <h2>OYUN BİTTİ</h2>
                <div>
                    <button class="btn" onclick="restartCurrentGame()">Yeniden Başlat 🔄</button>
                    <button class="btn" onclick="backToPanel()">Panele Dön 🏠</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Asset Yönetimi
        const assets = {};
        const assetList = [
            'heart.png', 'carrot.png', 'star.png', 'bomb.png', 'rock.png',
            'hole.png', 'littlewolf.png', 'longpipe.png', 'smallpipe.png',
            'giftblock.png', 'taretzone.png', 'background.png',
            'BunnyJump.gif', 'BunnyLieDown.gif', 'BunnyRun.gif', 'BunnyIdle.gif', 'BunnyDead.gif'
        ];

        let loadedCount = 0;
        assetList.forEach(name => {
            const img = new Image();
            img.src = name;
            img.onload = () => { loadedCount++; };
            assets[name] = img;
        });

        // Yükleme Ekranı
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 600);
            }, 1800);
        });

        // Genel Sistem Değişkenleri
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentGame = 0;
        let gameLoopId = null;
        let score = 0;
        let highScore = 0;
        let lives = 3;
        let isGameOver = false;

        // Tıklama Yakalayıcı
        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            handleInput(clickX, clickY);
        });

        function updateUI() {
            document.getElementById('current-score').innerText = score;
            highScore = localStorage.getItem('hs_game_' + currentGame) || 0;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('hs_game_' + currentGame, highScore);
            }
            document.getElementById('high-score').innerText = highScore;

            const hDisplay = document.getElementById('hearts-display');
            hDisplay.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                hDisplay.innerHTML += '<img src="heart.png">';
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            document.getElementById('game-over-overlay').style.display = 'flex';
        }

        function backToPanel() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-over-overlay').style.display = 'none';
            document.getElementById('panel-menu').style.display = 'grid';
            document.getElementById('panel-title').style.display = 'block';
            currentGame = 0;
        }

        function restartCurrentGame() {
            document.getElementById('game-over-overlay').style.display = 'none';
            startGame(currentGame);
        }

        function startGame(gameId) {
            currentGame = gameId;
            score = 0;
            lives = 3;
            isGameOver = false;
            document.getElementById('panel-menu').style.display = 'none';
            document.getElementById('panel-title').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            updateUI();

            if (gameLoopId) cancelAnimationFrame(gameLoopId);

            if (gameId === 1) initBunnyFlap();
            else if (gameId === 2) initBunnyRush();
            else if (gameId === 3) initPrecisionTap();
            else if (gameId === 4) initBunnyAttack();
            else if (gameId === 5) initCarrotCatch();
            else if (gameId === 6) initPerfectTiming();
            else if (gameId === 7) initMemoryTap();
        }

        let handleInput = (x, y) => {};

        /* ================= 1. BUNNY FLAP (KUSURSUZ) ================= */
        function initBunnyFlap() {
            let bY = 200, bV = 0, gravity = 0.38, jump = -6.5;
            let pipes = [], frame = 0;
            let isJumping = false;

            handleInput = () => {
                bV = jump;
                isJumping = true;
                setTimeout(() => isJumping = false, 250);
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                if(assets['background.png'].complete) ctx.drawImage(assets['background.png'], 0, 0, 360, 500);

                frame++;
                bV += gravity; bY += bV;

                if (frame % 100 === 0) {
                    let gap = 135;
                    let topH = Math.floor(Math.random() * (220 - 70)) + 70;
                    pipes.push({ x: 360, top: topH, bottom: 500 - topH - gap, passed: false });
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i]; p.x -= 2.2;
                    ctx.drawImage(assets['longpipe.png'], p.x, 0, 48, p.top);
                    ctx.drawImage(assets['smallpipe.png'], p.x, 500 - p.bottom, 48, p.bottom);

                    if (!p.passed && p.x < 100) { p.passed = true; score += 10; updateUI(); }

                    if (100 + 32 > p.x && 100 < p.x + 48) {
                        if (bY < p.top || bY + 32 > 500 - p.bottom) {
                            lives--; updateUI();
                            if (lives <= 0) return triggerGameOver();
                            pipes.splice(i, 1); continue;
                        }
                    }
                    if (p.x < -50) pipes.splice(i, 1);
                }

                let img = isJumping ? assets['BunnyJump.gif'] : assets['BunnyLieDown.gif'];
                ctx.drawImage(img, 100, bY, 40, 40);

                if (bY > 460 || bY < -10) {
                    lives--; updateUI();
                    if (lives <= 0) return triggerGameOver();
                    bY = 200; bV = 0;
                }

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 2. BUNNY RUSH (BACKGROUND TABAKALI) ================= */
        function initBunnyRush() {
            let bY = 370, bV = 0, gravity = 0.55, isGrounded = true;
            let obstacles = [], frame = 0, speed = 3.2;

            handleInput = () => {
                if (isGrounded) { bV = -11.5; isGrounded = false; score += 10; updateUI(); }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);

                frame++; speed += 0.0008;
                bV += gravity; bY += bV;
                if (bY >= 370) { bY = 370; bV = 0; isGrounded = true; }

                if (frame % Math.floor(110 / (speed/3)) === 0) {
                    let type = Math.random() > 0.4 ? 'rock.png' : 'bomb.png';
                    obstacles.push({ x: 360, type: type });
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i]; obs.x -= speed;
                    ctx.drawImage(assets[obs.type], obs.x, 380, 38, 38);

                    if (obs.x < 85 && obs.x > 45 && bY > 340) {
                        lives--; updateUI();
                        obstacles.splice(i, 1);
                        if (lives <= 0) return triggerGameOver();
                        continue;
                    }
                    if (obs.x < -40) obstacles.splice(i, 1);
                }

                ctx.drawImage(assets['BunnyRun.gif'], 50, bY, 48, 48);
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 3. PRECISION TAP (HIZLI & ÇOKLU KALP) ================= */
        function initPrecisionTap() {
            let hearts = [], timer = 5, maxTime = 5;

            function spawnHearts() {
                hearts = [];
                let count = score >= 50 ? 3 : (score >= 20 ? 2 : 1);
                for(let i=0; i<count; i++) {
                    hearts.push({
                        x: 70 + Math.random() * 200,
                        y: 140 + Math.random() * 200,
                        hit: false
                    });
                }
            }

            handleInput = (x, y) => {
                hearts.forEach(h => {
                    if (!h.hit && Math.hypot(x - h.x, y - h.y) < 35) {
                        h.hit = true; score += 10; updateUI();
                    }
                });

                if (hearts.every(h => h.hit)) {
                    maxTime = Math.max(1.2, maxTime - 0.25);
                    timer = maxTime;
                    spawnHearts();
                }
            };

            spawnHearts();
            let lastTime = Date.now();

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);
                ctx.drawImage(assets['taretzone.png'], 30, 100, 300, 300);

                let now = Date.now();
                let dt = (now - lastTime) / 1000;
                lastTime = now;

                timer -= dt;
                if (timer <= 0) {
                    lives--; updateUI();
                    maxTime = Math.max(1.2, maxTime - 0.2);
                    timer = maxTime;
                    if (lives <= 0) return triggerGameOver();
                    spawnHearts();
                }

                hearts.forEach(h => {
                    if(!h.hit) ctx.drawImage(assets['heart.png'], h.x - 18, h.y - 18, 36, 36);
                });

                ctx.fillStyle = "#ff1493";
                ctx.fillRect(30, 430, Math.max(0, (timer / maxTime)) * 300, 15);

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 4. BUNNY ATTACK ================= */
        function initBunnyAttack() {
            let holes = [
                {x: 45, y: 110}, {x: 205, y: 110},
                {x: 45, y: 230}, {x: 205, y: 230},
                {x: 45, y: 350}, {x: 205, y: 350}
            ];
            let activeHole = -1, type = 'wolf', popTimer = 0;

            function spawn() {
                activeHole = Math.floor(Math.random() * 6);
                type = Math.random() > 0.35 ? 'wolf' : 'bunny';
                popTimer = Math.max(25, 90 - score * 1.5);
            }

            handleInput = (x, y) => {
                if (activeHole !== -1) {
                    let h = holes[activeHole];
                    if (x > h.x && x < h.x + 100 && y > h.y - 20 && y < h.y + 80) {
                        if (type === 'wolf') { score += 10; updateUI(); }
                        else { lives--; updateUI(); if (lives <= 0) triggerGameOver(); }
                        activeHole = -1;
                    }
                }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);

                holes.forEach((h, idx) => {
                    ctx.drawImage(assets['hole.png'], h.x, h.y, 105, 85);
                    if (idx === activeHole) {
                        let img = type === 'wolf' ? assets['littlewolf.png'] : assets['BunnyIdle.gif'];
                        ctx.drawImage(img, h.x + 22, h.y - 32, 60, 60);
                    }
                });

                if (activeHole !== -1) {
                    popTimer--;
                    if (popTimer <= 0) {
                        if (type === 'wolf') { lives--; updateUI(); if (lives <= 0) triggerGameOver(); }
                        activeHole = -1;
                    }
                } else if (Math.random() < 0.04) spawn();

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 5. CARROT CATCH (BACKGROUND TABAKALI) ================= */
        function initCarrotCatch() {
            let bX = 155, items = [], frame = 0, speed = 2.8;

            handleInput = (x) => { bX = Math.max(10, Math.min(300, x - 25)); };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);

                frame++; speed += 0.0009;

                if (frame % 38 === 0) {
                    let r = Math.random();
                    let t = r < 0.6 ? 'carrot.png' : (r < 0.8 ? 'star.png' : 'bomb.png');
                    items.push({ x: 20 + Math.random() * 320, y: 0, type: t });
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i]; it.y += speed;
                    ctx.drawImage(assets[it.type], it.x, it.y, 32, 32);

                    if (it.y > 390 && it.x > bX - 22 && it.x < bX + 52) {
                        if (it.type === 'carrot.png') score += 10;
                        else if (it.type === 'star.png') score += 25;
                        else { lives--; if (lives <= 0) return triggerGameOver(); }
                        updateUI(); items.splice(i, 1); continue;
                    }
                    if (it.y > 480) items.splice(i, 1);
                }

                ctx.drawImage(assets['BunnyRun.gif'], bX, 395, 50, 50);
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 6. PERFECT TIMING (REFAKTE EDİLMİŞ) ================= */
        function initPerfectTiming() {
            let targetX = 130, boxX = 0, boxDir = 1, speed = 3.5;
            
            handleInput = () => {
                let diff = Math.abs(boxX - targetX);
                if (diff < 30) {
                    score += 15; speed += 0.4; updateUI();
                    targetX = 30 + Math.random() * 200;
                } else {
                    lives--; updateUI();
                    if (lives <= 0) triggerGameOver();
                }
            };

            function loop() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);

                // Hedef Bölge
                ctx.strokeStyle = "#ff1493"; ctx.lineWidth = 3;
                ctx.strokeRect(targetX, 220, 80, 50);
                ctx.drawImage(assets['star.png'], targetX + 25, 230, 30, 30);

                // Sağa Sola Kayan Blok
                boxX += speed * boxDir;
                if (boxX < 0 || boxX > 280) boxDir *= -1;
                ctx.drawImage(assets['giftblock.png'], boxX, 220, 80, 50);

                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }

        /* ================= 7. MEMORY TAP ================= */
        function initMemoryTap() {
            let sequence = [], userSeq = [], showing = false;
            const icons = ['star.png', 'bomb.png', 'rock.png', 'heart.png'];

            function nextRound() {
                showing = true; userSeq = [];
                sequence.push(icons[Math.floor(Math.random() * 4)]);
                let idx = 0;
                
                let int = setInterval(() => {
                    ctx.clearRect(0, 0, 360, 500);
                    ctx.drawImage(assets['background.png'], 0, 0, 360, 500);
                    ctx.drawImage(assets[sequence[idx]], 130, 120, 100, 100);
                    idx++;
                    if (idx >= sequence.length) {
                        clearInterval(int);
                        setTimeout(() => { showing = false; drawButtons(); }, 700);
                    }
                }, 650);
            }

            function drawButtons() {
                ctx.clearRect(0, 0, 360, 500);
                ctx.drawImage(assets['background.png'], 0, 0, 360, 500);
                ctx.fillStyle = "#ff1493"; ctx.font = "bold 16px Arial";
                ctx.fillText("Sırayı Hatırla ve Dokun!", 90, 80);
                icons.forEach((ic, i) => {
                    let x = (i % 2) * 130 + 60, y = Math.floor(i / 2) * 130 + 150;
                    ctx.drawImage(assets[ic], x, y, 85, 85);
                });
            }

            handleInput = (x, y) => {
                if (showing) return;
                icons.forEach((ic, i) => {
                    let bx = (i % 2) * 130 + 60, by = Math.floor(i / 2) * 130 + 150;
                    if (x > bx && x < bx + 85 && y > by && y < by + 85) {
                        userSeq.push(ic);
                        let step = userSeq.length - 1;
                        if (userSeq[step] !== sequence[step]) {
                            lives--; updateUI();
                            if (lives <= 0) triggerGameOver();
                            else nextRound();
                        } else if (userSeq.length === sequence.length) {
                            score += 25; updateUI(); nextRound();
                        }
                    }
                });
            };

            nextRound();
            function loop() {
                if (!showing && !isGameOver) drawButtons();
                if (!isGameOver) gameLoopId = requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
